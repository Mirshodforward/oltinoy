# Oltinoy Collection — Nginx reverse proxy + TLS
# Adapt server_name/paths, then symlink into /etc/nginx/sites-enabled/
# and remove the default site. Certbot manages the ssl_certificate lines
# (run `certbot --nginx -d oltinoycollection.uz -d www.oltinoycollection.uz` after first deploy).

limit_req_zone $binary_remote_addr zone=booking:10m rate=6r/m;

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name oltinoycollection.uz www.oltinoycollection.uz;

  # ssl_certificate     /etc/letsencrypt/live/oltinoycollection.uz/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/oltinoycollection.uz/privkey.pem;

  client_max_body_size 25m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  location /uploads/ {
    alias /var/www/oltinoy/uploads/;
    expires 365d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location /api/booking {
    limit_req zone=booking burst=4 nodelay;
    proxy_pass http://127.0.0.1:11000;
    include proxy_params;
  }

  location /_next/static/ {
    proxy_pass http://127.0.0.1:11000;
    include proxy_params;
    expires 365d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:11000;
    include proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# apex/www → https redirect
server {
  listen 80;
  listen [::]:80;
  server_name oltinoycollection.uz www.oltinoycollection.uz;
  return 301 https://oltinoycollection.uz$request_uri;
}
