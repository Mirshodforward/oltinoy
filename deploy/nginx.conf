# Oltinoy Collection — oltinoycollection.uz reverse proxy (HTTP)
# App: PM2 "oltinoy-web" → 127.0.0.1:11000 (next start -p 11000)
#
# O'rnatish:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/oltinoycollection.uz
#   sudo ln -s /etc/nginx/sites-available/oltinoycollection.uz /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx --redirect -d oltinoycollection.uz -d www.oltinoycollection.uz
#
# Certbot 443 (SSL) server blokini, sertifikat yo'llarini va HTTP→HTTPS
# redirectni shu blokka AVTOMATIK qo'shadi — bu yerda qo'lda yozish shart emas.

limit_req_zone $binary_remote_addr zone=booking:10m rate=6r/m;

server {
  listen 80;
  listen [::]:80;
  server_name oltinoycollection.uz www.oltinoycollection.uz;

  client_max_body_size 25m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # Yuklangan rasmlar — nginx to'g'ridan-to'g'ri beradi (Next'ga tegmaydi)
  location /uploads/ {
    alias /var/www/oltinoy/uploads/;
    # Bitta Cache-Control yetarli — `expires` bilan birga yozilsa sarlavha
    # ikki marta takrorlanadi va ba'zi proksilar chalkashadi.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  # Booking API — rate limit (spam/abuse himoyasi)
  location /api/booking {
    limit_req zone=booking burst=4 nodelay;
    proxy_pass http://127.0.0.1:11000;
    include proxy_params;
  }

  # Next.js statik assetlar — uzoq muddatli immutable cache
  location /_next/static/ {
    proxy_pass http://127.0.0.1:11000;
    include proxy_params;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    proxy_pass http://127.0.0.1:11000;
    include proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
